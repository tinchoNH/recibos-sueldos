services:
  - type: web
    name: recibos-sueldos
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RENDER
        value: "true"
      - key: SMTP_HOST
        sync: false        # lo cargás vos en el panel de Render
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false        # el email desde donde manda
      - key: SMTP_PASSWORD
        sync: false        # contraseña / app password
      - key: SMTP_FROM_NAME
        value: "RRHH"
      - key: SMTP_USE_SSL
        value: "false"
